<svg xmlns="http://www.w3.org/2000/svg" width="920" height="395" viewBox="0 0 920 395" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">DoRA training: elapsed time versus total compute</title>
<desc id="desc">Training-only resource records. The latest checkpoint includes its four-L4 parent&#x27;s training plus continuation. This is not a controlled scaling experiment and excludes preparation and evaluation.</desc>
<rect width="920" height="395" fill="#ffffff"/>
<text x="30" y="34" font-size="23" fill="#172b3a" font-weight="700" text-anchor="start">DoRA training: elapsed time versus total compute</text>
<text x="30" y="58" font-size="13" fill="#546b79" font-weight="400" text-anchor="start">Training-loop measurements · latest checkpoint includes its parent</text>
<text x="245" y="100" font-size="16" fill="#172b3a" font-weight="700" text-anchor="start">Sequential elapsed minutes</text>
<text x="245" y="121" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Training loops only</text>
<text x="583" y="100" font-size="16" fill="#172b3a" font-weight="700" text-anchor="start">Allocated GPU-hours</text>
<text x="583" y="121" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Wall hours × GPU count</text>
<line x1="245.00" x2="245.00" y1="138" y2="277" stroke="#dfe8e8"/>
<text x="245.00" y="298" font-size="12" fill="#546b79" font-weight="400" text-anchor="middle">0</text>
