<text x="52" y="354" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Preference training (DPO) on 335 pairs</text>
<rect x="470" y="325" width="330" height="32" rx="6" fill="#b42318" fill-opacity="0.12" stroke="#b42318" stroke-width="1"/>
<text x="480" y="346" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Rejected: the checkpoints stopped abstaining</text>
<line x1="20" y1="366" x2="800" y2="366" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="392" r="6" fill="#b42318"/>
<text x="52" y="388" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 5b</text>
<text x="52" y="404" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >DPO again, with abstention pairs added</text>
<rect x="470" y="375" width="330" height="32" rx="6" fill="#b42318" fill-opacity="0.12" stroke="#b42318" stroke-width="1"/>
<text x="480" y="390" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Rejected: one eligible checkpoint, candF1, missed</text>
<text x="480" y="403" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >the safety bound</text>
<line x1="20" y1="416" x2="800" y2="416" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="442" r="6" fill="#b42318"/>
<text x="52" y="438" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 6</text>
<text x="52" y="454" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Trained answer checkers V2m and V2b</text>
<rect x="470" y="425" width="330" height="32" rx="6" fill="#b42318" fill-opacity="0.12" stroke="#b42318" stroke-width="1"/>
<text x="480" y="446" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Rejected: no threshold met the hidden-evidence limit</text>
</svg>
