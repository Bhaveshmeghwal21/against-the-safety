<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="820" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" >What we tried, and what we kept</text>
<text x="20" y="46" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Every rule was written down before the data it applied to. Details in docs/HISTORY.md.</text>
<line x1="20" y1="66" x2="800" y2="66" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="92" r="6" fill="#1565c0"/>
<text x="52" y="88" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 1</text>
<text x="52" y="104" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Main adapter, with refusal examples, against a control without them</text>
<rect x="470" y="75" width="330" height="32" rx="6" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="1"/>
<text x="480" y="96" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Adopted: main</text>
<line x1="20" y1="116" x2="800" y2="116" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="142" r="6" fill="#ef6c00"/>
<text x="52" y="138" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 2</text>
<text x="52" y="154" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >candA: fewer refusal examples in training</text>
<rect x="470" y="125" width="330" height="32" rx="6" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-width="1"/>
<text x="480" y="140" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Alternative: fewer refusals, more unsupported</text>
<text x="480" y="153" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >answers</text>
<line x1="20" y1="166" x2="800" y2="166" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="192" r="6" fill="#b42318"/>
