<text x="52" y="204" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >A SQuAD patch for single-passage and two-part questions</text>
<rect x="470" y="175" width="330" height="32" rx="6" fill="#b42318" fill-opacity="0.12" stroke="#b42318" stroke-width="1"/>
<text x="480" y="190" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Rejected: failed its safety guard (6 to 31</text>
<text x="480" y="203" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >unsupported SQuAD answers of 109)</text>
<line x1="20" y1="216" x2="800" y2="216" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="242" r="6" fill="#ef6c00"/>
<text x="52" y="238" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 4</text>
<text x="52" y="254" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Matched-evidence curriculum (candE, candF)</text>
<rect x="470" y="225" width="330" height="32" rx="6" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-width="1"/>
<text x="480" y="240" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >No checkpoint met the release rules; candF1 kept as</text>
<text x="480" y="253" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >an alternative</text>
<line x1="20" y1="266" x2="800" y2="266" stroke="#d0d7de" stroke-width="0.8"/>
<circle cx="34" cy="292" r="6" fill="#1565c0"/>
<text x="52" y="288" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start" >Round 5</text>
<text x="52" y="304" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >Fail-closed rule and self-check on the output</text>
<rect x="470" y="275" width="330" height="32" rx="6" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="1"/>
<text x="480" y="296" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start" >Adopted: macro 47.9% to 58.0%, no retraining</text>
<line x1="20" y1="316" x2="800" y2="316" stroke="#d0d7de" stroke-width="0.8"/>
