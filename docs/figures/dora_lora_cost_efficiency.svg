<text x="782.10" y="295" font-size="13" fill="#172b3a" font-weight="700" text-anchor="start">$36.78</text>
<text x="881" y="295" font-size="11" fill="#546b79" font-weight="400" text-anchor="start">L4</text>
<text x="226" y="337" font-size="13" fill="#172b3a" font-weight="600" text-anchor="end">Kaggle DoRA + repairs</text>
<rect x="245" y="320" width="174.80" height="23" rx="4" fill="#8055a1"/>
<text x="426.80" y="337" font-size="13" fill="#172b3a" font-weight="700" text-anchor="start">47.34%</text>
<text x="591" y="337" font-size="13" fill="#546b79" font-weight="400" text-anchor="start">Not measured</text>
<text x="226" y="379" font-size="13" fill="#172b3a" font-weight="600" text-anchor="end">Evidence-order + repairs</text>
<rect x="245" y="362" width="167.66" height="23" rx="4" fill="#b05260"/>
<text x="419.66" y="379" font-size="13" fill="#172b3a" font-weight="700" text-anchor="start">45.41%</text>
<rect x="583" y="362" width="119.70" height="23" rx="4" fill="#b05260"/>
<text x="709.70" y="379" font-size="13" fill="#172b3a" font-weight="700" text-anchor="start">$22.92</text>
<text x="881" y="379" font-size="11" fill="#546b79" font-weight="400" text-anchor="start">L4</text>
<text x="30" y="453" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">T4: $0.526/GPU-hour. L4: $0.7992/GPU-hour (historical 12 Nov 2026 scenario). Not invoices.</text>
<text x="30" y="475" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Different hardware, batching and serving assumptions; excludes idle time, loading and other infrastructure.</text>
<text x="30" y="497" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Checkpoint-specific scorer exclusions differ. Lower cost alone does not establish better evidence safety.</text>
</svg>
