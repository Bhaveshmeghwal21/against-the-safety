<text x="245" y="121" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Higher is better</text>
<text x="583" y="100" font-size="16" fill="#172b3a" font-weight="700" text-anchor="start">USD per 10,000 episodes</text>
<text x="583" y="121" font-size="12" fill="#546b79" font-weight="400" text-anchor="start">Historical busy-GPU scenarios</text>
