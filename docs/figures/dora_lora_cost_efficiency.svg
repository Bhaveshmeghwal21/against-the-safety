<text x="818.0" y="426" font-size="12" fill="#546b79" font-weight="400" text-anchor="middle">$45</text>
<text x="226" y="169" font-size="13" fill="#172b3a" font-weight="600" text-anchor="end">Main LoRA + repairs</text>
<rect x="245" y="152" width="191.05" height="23" rx="4" fill="#315a75"/>
<text x="443.05" y="169" font-size="13" fill="#172b3a" font-weight="700" text-anchor="start">51.74%</text>
