<svg xmlns="http://www.w3.org/2000/svg" width="920" height="518" viewBox="0 0 920 518" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">LoRA and DoRA: performance and serving cost</title>
<desc id="desc">All six adapters with fail-closed and the fixed main-LoRA verifier. Four serving costs are available; candA and Kaggle lr5e-5 costs are not measured. Historical T4 and L4 assumptions differ; no equal-hardware cost ranking is established.</desc>
<rect width="920" height="518" fill="#ffffff"/>
